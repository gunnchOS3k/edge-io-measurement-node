CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Zephyr-native production path requirements (Continuation VII §18)
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_PM_DEVICE=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Digital DK bring-up without on-board EVT sensors. Set to n on EVT silicon.
CONFIG_RING_USE_FAKE_BUS=y
